services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8.0
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://quant:quant@postgres:5432/quant
      MONGO_URL: mongodb://mongo:27017
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
volumes:
  pgdata:
  mongodata:
