name: Verify QuantScore
on:
  push:
    branches: [project/quantscore-submission]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-and-frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U quant -d quant"
          --health-interval 5s --health-timeout 5s --health-retries 15
      mongo:
        image: mongo:8.0
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://quant:quant@127.0.0.1:5432/quant
      MONGO_URL: mongodb://127.0.0.1:27017
      QUANT_INTEGRATION: '1'
      QUANT_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Seed disposable databases
        working-directory: backend
        env:
          QUANT_ALLOW_TEST_SEED: '1'
        run: python -m app.seed_test_data
      - name: Test native databases and concurrent trades
        working-directory: backend
        run: python -m pytest -q --junitxml=../test-results.xml
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Verify equivalent benchmark results
        working-directory: backend
        run: python -m app.benchmark --limit 500 --repeats 3 > ../benchmark-ci.json
      - name: Build deployment image
        run: docker build -t quantscore-ci .
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            test-results.xml
            benchmark-ci.json
