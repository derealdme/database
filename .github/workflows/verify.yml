name: Verify QuantScore
on:
  push:
    branches: [project/quantscore-submission]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-and-frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U quant -d quant"
          --health-interval 5s --health-timeout 5s --health-retries 15
      mongo:
        image: mongo:8.0
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://quant:quant@127.0.0.1:5432/quant
      MONGO_URL: mongodb://127.0.0.1:27017
      QUANT_INTEGRATION: '1'
      QUANT_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Seed disposable databases
        working-directory: backend
        env:
          QUANT_ALLOW_TEST_SEED: '1'
        run: python -m app.seed_test_data
      - name: Test native databases and concurrent trades
        working-directory: backend
        run: python -m pytest -q --junitxml=../test-results.xml
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Verify equivalent benchmark results
        working-directory: backend
        run: python -m app.benchmark --limit 500 --repeats 3 > ../benchmark-ci.json
      - name: Build deployment image
        run: docker build -t quantscore-ci .
      - name: Smoke test built application container
        run: |
          docker run -d --name quant-app --network host -e DATABASE_URL -e MONGO_URL quantscore-ci
          python - <<'PYTEST'
          import time, urllib.request, json
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2) as r:
                      assert json.load(r)=={'postgres':'ok','mongodb':'ok'}
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(1)
          for path in ['/', '/docs', '/api/stocks?limit=2']:
              with urllib.request.urlopen('http://127.0.0.1:8000'+path,timeout=5) as r:
                  assert r.status==200
          PYTEST
      - name: Collect container logs
        if: always()
        run: docker logs quant-app > container.log 2>&1 || true
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            test-results.xml
            benchmark-ci.json
            container.log
