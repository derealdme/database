# CI skeleton. Steps marked TODO are finished in INSTRUCTIONS.md step 3.
# Unit job is expected to be red until step 2 replaces the placeholder tests.
name: CI

on:
  push:
    branches: [project/final]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    defaults: { run: { working-directory: backend } }
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: quantscore
      MYSQL_DB: quantscore
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: quantscore
      JWT_SECRET: ci-only-secret
      RUN_INTEGRATION: "1"
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: quantscore }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pquantscore"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7.0.14
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Load relational schema, views, triggers, procedures
        run: cd ../etl && python step1_schema.py
      - name: Create Mongo collections, validators, indexes
        run: python -c "from app.db import mongo; mongo.ensure_collections()"
      - name: Seed tiny fixture (TODO step 3)
        run: python tests/fixtures/seed_ci.py
      - run: pytest -q tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vite build
